<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ohio">
<title>Ohio Off-Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Neon arcade: midnight to electric blue to aqua gradient, with big faded art behind each page. */
  --bg: #0f0c29;
  --grad: linear-gradient(160deg, #0f0c29 0%, #1b1a72 45%, #2b2ff0 85%, #00b8a0 130%);
  --surface: rgba(18, 16, 58, .78);
  --solid: #17154a;
  --ink: #f3f4ff;
  --muted: #a9b0d6;
  --line: rgba(255, 255, 255, .14);
  --accent: #00f5d4;
  --accent-ink: #0f0c29;
  --accent-text: #00f5d4;
  --glow: 0 0 18px rgba(0, 245, 212, .45);
  --good: #3ddc84;
  --bad: #ff4d6d;
  --soft: rgba(255, 255, 255, .07);
  --display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); min-height: 100%; font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.bgfill { position: fixed; inset: 0; z-index: -2; background: var(--grad); }
#bgart { position: fixed; z-index: -1; right: -18vw; top: 16vh; width: 95vw; max-width: 620px; aspect-ratio: 1; color: var(--accent); opacity: .09; pointer-events: none; transform: rotate(-12deg); }
#bgart svg { width: 100%; height: 100%; }
.card, .tile, .ex, .meal, .week button, .month, .phase, .logitem, details.block, .tablewrap { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; line-height: 1.05; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(92px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 30px; font-weight: 800; color: var(--accent); text-shadow: var(--glow); }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.ok .dot { background: var(--good); }
.sync.warn .dot { background: var(--accent); }
.sync.err .dot { background: var(--bad); }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; }
.tile b { font-family: var(--display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); line-height: 1.25; }

/* Generic */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 20px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.chip.dad { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.note { border-left: 4px solid var(--accent); background: var(--soft); padding: 10px 12px; font-size: 15px; }
.alert { border-left: 4px solid var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); padding: 10px 12px; font-size: 15px; }
.sec-title { font-family: var(--display); text-transform: uppercase; font-size: 15px; letter-spacing: .08em; color: var(--muted); margin: 6px 2px 0; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }

/* Nav rows */
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav .label { text-align: center; flex: 1; }
.daynav .label b { display: block; font-family: var(--display); font-size: 22px; text-transform: uppercase; }
.daynav .label span { font-size: 13px; color: var(--muted); }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
.linkbtn { background: none; border: none; color: var(--accent-text); font-weight: 600; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }
.segctl { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.segctl button { border: none; background: transparent; border-radius: 9px; padding: 8px; font-weight: 700; }
.segctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Session hero */
.hero { border-left: 6px solid var(--accent); }
.hero .kicker { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: var(--accent-text); }
.hero h2 { font-size: 36px; font-weight: 800; }
.hero .sub { font-size: 17px; font-weight: 600; margin-top: -4px; }

/* Warm-up */
details.block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
details.block > summary { list-style: none; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
details.block > summary::-webkit-details-marker { display: none; }
details.block > summary::after { content: "Show"; font-size: 13px; color: var(--accent-text); font-weight: 600; }
details.block[open] > summary::after { content: "Hide"; }
.wu { list-style: none; margin: 0; padding: 0 16px 14px; display: flex; flex-direction: column; gap: 6px; }
.wu li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; border-top: 1px dashed var(--line); padding-top: 6px; font-size: 15px; }
.wu li .d { color: var(--muted); text-align: right; white-space: nowrap; }

/* Exercises */
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.tick { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--soft); display: grid; place-items: center; color: transparent; padding: 0; }
.tick svg { width: 22px; height: 22px; }
.done > .tick, .tick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); }
.ex.done .ex-name { color: var(--muted); }
.ex-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ex-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.ex-name { font-weight: 700; font-size: 16px; }
.ex-dose { font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--accent-text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cue { margin: 0; font-size: 14px; color: var(--muted); }
.ex-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.pill { border: 1.5px solid var(--line); background: var(--soft); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; }
.pill svg { width: 16px; height: 16px; }
.pill.tt { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.tt.mini { padding: 3px 9px; font-size: 12px; }
.lift { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; padding: 10px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
.stepper { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.stepper button { width: 40px; height: 40px; border: none; background: transparent; font-size: 20px; font-weight: 700; }
.stepper input { width: 64px; height: 40px; border: none; text-align: center; font-weight: 700; font-size: 17px; background: transparent; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); flex-basis: 100%; }

/* Finish card */
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.seg button, .two button { border: 1.5px solid var(--line); background: var(--soft); border-radius: 12px; padding: 8px 4px; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.seg button b { font-family: var(--display); font-size: 20px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two button { padding: 12px 6px; font-size: 15px; }
.two button[aria-pressed="true"].ok { background: var(--good); border-color: var(--good); color: #fff; }
.two button[aria-pressed="true"].hurt { background: var(--bad); border-color: var(--bad); color: #fff; }
textarea, .field input, .field select { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--soft); padding: 10px 12px; }
textarea { min-height: 72px; resize: vertical; }
label.lbl { font-size: 14px; font-weight: 600; }
.primary { box-shadow: var(--glow); width: 100%; border: none; border-radius: 14px; padding: 15px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-size: 21px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.primary:disabled { opacity: .5; }
.saved-line { font-size: 14px; color: var(--good); font-weight: 600; text-align: center; }

/* Calendar */
.week { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.week button { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
.week .today-row { border: 2px solid var(--accent); }
.wday { font-family: var(--display); text-transform: uppercase; text-align: center; line-height: 1; }
.wday b { display: block; font-size: 22px; }
.wday span { font-size: 12px; color: var(--muted); }
.wtitle { font-weight: 700; }
.wsub { font-size: 14px; color: var(--muted); }
.status { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.status.done { background: var(--good); color: #fff; border-color: var(--good); }
.status.today { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.status.missed { color: var(--muted); }
.status.rest { color: var(--muted); border-style: dashed; }
.month { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.mdow, .mrow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mdow span { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 7px 0; text-transform: uppercase; }
.mcell { border: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: none; min-height: 62px; padding: 4px 2px; color: inherit; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; min-width: 0; }
.mrow .mcell:first-child { border-left: 0; }
.mcell.out { opacity: .35; }
.mcell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.mcell.isdone { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.mnum { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.mtag { font-size: 10.5px; font-weight: 700; padding: 1px 4px; border-radius: 5px; background: var(--soft); border: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.mtag.home { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.mtag.test { background: var(--bad); color: #fff; border-color: transparent; }
.mtag.ok { background: var(--good); color: #fff; border-color: transparent; }
.mkey { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.mkey .mtag { display: inline-block; margin-right: 4px; }

/* Plan */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.phase.now { border: 2px solid var(--accent); }
.phase.past { opacity: .62; }
.phase-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.phase h3 { font-size: 20px; }
.phase .dates { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bar { height: 8px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* Meals */
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.meal.done .mname { color: var(--muted); }
.mtime { font-family: var(--display); font-size: 15px; color: var(--accent-text); text-transform: uppercase; letter-spacing: .04em; }
.mname { font-weight: 700; }
.mwhat { font-size: 14px; color: var(--muted); }
.shop { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.shop li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 15px; }
.shop li:first-child { border-top: none; }
.shop li span:last-child { color: var(--muted); white-space: nowrap; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
.spark { width: 100%; height: 120px; display: block; }

/* Progress */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; align-items: flex-end; }
.row .field { flex: 1; }
.row .pill { height: 46px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--solid); }
thead th { font-family: var(--display); text-transform: uppercase; font-size: 14px; letter-spacing: .03em; color: var(--muted); }
tr:last-child td { border-bottom: none; }
.up { color: var(--good); font-weight: 700; }
.down { color: var(--bad); font-weight: 700; }
.lifts3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lifts3 .tile b { font-size: 26px; }
.loglist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.logitem { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.logitem .row2 { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1.5px dashed var(--line); border-radius: 14px; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(15, 12, 41, .94); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 5; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; border-radius: 10px; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--soft); }
.tabs a[aria-current="page"] svg { color: var(--accent-text); }

/* Rest timer + toast */
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); width: min(528px, calc(100% - 32px)); background: var(--ink); color: var(--bg); border-radius: 18px; padding: 12px 14px; display: none; align-items: center; gap: 12px; z-index: 6; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.timer.show { display: flex; }
.timer .t { font-family: var(--display); font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 92px; }
.timer .lab { flex: 1; font-size: 14px; line-height: 1.3; }
.timer button { border: none; border-radius: 10px; padding: 9px 12px; font-weight: 700; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); }
.timer.finished { background: var(--accent); color: var(--accent-ink); }
.timer.finished button { color: var(--accent-ink); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 9; display: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { display: block; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { .ex, .tick, .meal { transition: background-color .15s, border-color .15s; } }
</style>
</head>
<body>
<div class="bgfill"></div>
<div id="bgart" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Ohio</h1>
      <p id="phaseLine">Off-season</p>
    </div>
    <div class="sync" id="sync" role="status"><span class="dot"></span><span id="syncText">Loading</span></div>
  </header>
  <div class="strip" id="strip"></div>
  <main>
    <section id="view-today" hidden></section>
    <section id="view-cal" hidden></section>
    <section id="view-meals" hidden></section>
    <section id="view-progress" hidden></section>
    <section id="view-plan" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Today</a>
  <a href="#cal" data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
  <a href="#meals" data-tab="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 2-3 5-3 8h3v10"/></svg>Meals</a>
  <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a>
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Plan</a>
</nav>

<div class="timer" id="timer" role="timer" aria-live="polite">
  <div class="t" id="timerT">1:30</div>
  <div class="lab" id="timerLab">Rest. Full recovery so the next rep is fast.</div>
  <button type="button" id="timerAdd">+15s</button>
  <button type="button" id="timerStop">Done</button>
</div>
<div class="toast" id="toast" role="status"></div>

<!--__NATIVE__-->
<script>
(() => {
'use strict';
/*__PROGRAM__*/

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TODAY = iso(new Date());
const mmss = s => `${Math.floor(s / 60)}:${pad(Math.max(0, s % 60))}`;
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_TIMER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4M9 2h6"/></svg>';

let actx = null;
function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) { actx = null; } return actx; }
function tone(f, t, d, type, vol) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + t;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + 0.05);
  } catch (e) {}
}
const coin = (t, p) => { tone(988 * p, t, 0.08, 'square', 0.12); tone(1319 * p, t + 0.07, 0.35, 'square', 0.12); };
const SOUNDS = {
  'Coin cascade': () => { for (let i = 0; i < 5; i++) coin(i * 0.09, 1 + i * 0.06); },
  'Jackpot bells': () => { [1047, 1319, 1568, 2093, 1568, 2093, 2637].forEach((f, i) => { tone(f, i * 0.11, 0.6, 'sine', 0.22); tone(f * 2.01, i * 0.11, 0.3, 'sine', 0.06); }); },
  'Level up': () => { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.06, 0.14, 'square', 0.1)); tone(2093, 0.38, 0.5, 'triangle', 0.18); },
  'Big win short': () => { for (let i = 0; i < 7; i++) coin(i * 0.07, 1 + Math.random() * 0.35); [784, 1047].forEach(f => tone(f, 0.5, 0.6, 'triangle', 0.1)); },

};

/* ---------- Lift progression ---------- */
const LIFTS = LIFT_INFO;
const incFor = (lift, kg) => { const i = (LIFTS[lift] || {}).inc || [2.5, 999, 2.5]; return kg < i[1] ? i[0] : i[2]; };
// Which version of each big lift he's doing (saved on this phone)
const variantIdx = slot => Math.min(VARIANTS[slot].length - 1, Math.max(0, Number(LS.get('ohio_var_' + slot, 0)) || 0));
function resolve(e) {
  if (!e.slot) return e;
  const v = VARIANTS[e.slot][variantIdx(e.slot)];
  return { ...e, n: v.n, c: (e.extra || '') + v.c, tt: v.tt, lift: v.lift };
}
const itemsOf = s => s.items.map(resolve);
function lastLift(lift, beforeDate) {
  const rows = state.logs.filter(l => l.lifts && l.lifts[lift] && Number(l.lifts[lift].kg) > 0 && (!beforeDate || l.date < beforeDate)).sort((a, b) => a.date < b.date ? 1 : -1);
  return rows[0] ? { date: rows[0].date, kg: Number(rows[0].lifts[lift].kg), clean: !!rows[0].lifts[lift].clean } : null;
}
function suggest(lift, date) {
  const last = lastLift(lift, date);
  if (!last) return { kg: LIFTS[lift].start, text: `Starting weight ${LIFTS[lift].start}kg. Technique first.` };
  if (phaseFor(date).sp !== phaseFor(last.date).sp) return { kg: last.kg, text: `New reps this block. Last was ${last.kg}kg on ${fmtShort(last.date)}. Pick a weight that leaves 2 in the tank.` };
  if (last.clean) { const kg = last.kg + incFor(lift, last.kg); return { kg, text: `Last ${last.kg}kg on ${fmtShort(last.date)}, all clean → try ${kg}kg.` }; }
  return { kg: last.kg, text: `Last ${last.kg}kg on ${fmtShort(last.date)}, form slipped → stay at ${last.kg}kg.` };
}

const store = {
  db: null, mode: 'loading',
  async init() {
    setSync('warn', 'Connecting');
    let db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) {
      this.mode = 'local';
      COLLS.forEach(c => { state[c] = LS.get('ohio_' + c, []); });
      setSync('warn', 'This phone only'); render(); return;
    }
    this.db = db;
    try { const user = await window.claude.use('user'); if (user && typeof user.can === 'function') { const c = await user.can('data.write'); if (c === false) state.readOnly = true; } } catch (e) {}
    const got = {};
    const timer = setTimeout(() => { if (this.mode === 'loading') setSync('warn', 'Can’t reach data yet'); }, 10000);
    COLLS.forEach(c => {
      db.collection(c).onSnapshot(snap => {
        state[c] = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
        if (!snap.metadata.fromCache) { got[c] = true; if (COLLS.every(x => got[x])) { clearTimeout(timer); this.mode = 'synced'; setSync('ok', state.readOnly ? 'View only' : 'Synced'); } }
        render(true);
      }, () => { clearTimeout(timer); this.mode = 'error'; setSync('err', 'Data offline'); });
    });
  },
  async put(c, id, data) {
    if (this.db) {
      const ref = this.db.collection(c).doc(id);
      for (let attempt = 0; attempt < 2; attempt++) {
        try { await ref.set(data); return true; }
        catch (e) {
          const code = e && e.code;
          if (code === 'unavailable' && attempt === 0) { await sleep(600 + Math.random() * 900); continue; }
          if (code === 'invalid_argument') { state.readOnly = true; toast(NO_WRITE); }
          else if (code === 'quota_exceeded') toast('Storage is full. Delete some old entries.');
          else toast('Couldn’t save. Check signal and try again.');
          return false;
        }
      }
      return false;
    }
    const arr = state[c].filter(x => x.id !== id); arr.push({ id, ...data }); state[c] = arr;
    LS.set('ohio_' + c, arr); render(true); return true;
  },
  async del(c, id) {
    if (this.db) { try { await this.db.collection(c).doc(id).delete(); return true; } catch (e) { toast('Couldn’t delete. Try again.'); return false; } }
    state[c] = state[c].filter(x => x.id !== id); LS.set('ohio_' + c, state[c]); render(true); return true;
  }
};

function streak() {

    if (done) n++; else if (d !== TODAY) break;

}

async function saveSession() {
  const { d, key, id, ph, s } = currentCtx();
  const dr = touchDraft();
  dr.notes = ($('#notes') || {}).value || '';
  itemsOf(s).forEach(e => { if (e.lift) { const kg = parseFloat(($('#kg-' + e.lift) || {}).value); dr.lifts[e.lift] = { kg: isFinite(kg) ? kg : 0, clean: !!($('#clean-' + e.lift) || {}).checked }; } });
  const rec = { date: d, key, phase: ph.id, title: s.title, sub: s.sub, total: s.items.length, done: dr.done.slice().sort((a, b) => a - b),
    lifts: dr.lifts, feel: Number(dr.feel) || 0, pain: dr.pain === true ? true : dr.pain === false ? false : null, notes: dr.notes.slice(0, 2000), savedAt: new Date().toISOString() };
  const btn = $('[data-act="save"]'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const ok = await store.put('logs', id, rec);
  if (ok) { delete state.drafts[id]; saveDrafts(); celebrate(true); toast(rec.pain ? 'Saved. Get that pain checked before training it again.' : 'Session saved. Streak: ' + streak()); }
  render(true);
}

/* ---------- Meals ---------- */
function weightTarget(d) { return 90 + Math.max(0, daysBetween(START, d)) / 7 * 0.4; }
function sparkline(ws) {
  if (ws.length < 2) return '';
  const W = 320, H = 120, P = 8;
  const xs = ws.map(w => daysBetween(ws[0].date, w.date)), span = Math.max(1, xs[xs.length - 1]);
  const all = ws.map(w => w.kg).concat(ws.map(w => weightTarget(w.date)));
  const lo = Math.floor(Math.min(...all) - 0.5), hi = Math.ceil(Math.max(...all) + 0.5);
  const X = x => P + x / span * (W - 2 * P), Y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
  const line = ws.map((w, i) => `${X(xs[i]).toFixed(1)},${Y(w.kg).toFixed(1)}`).join(' ');
  const t0 = ws[0], t1 = ws[ws.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight trend from ${t0.kg}kg to ${t1.kg}kg">
    <line x1="${X(0)}" y1="${Y(weightTarget(t0.date))}" x2="${X(span)}" y2="${Y(weightTarget(t1.date))}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 4" stroke-width="2"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="${X(span)}" cy="${Y(t1.kg)}" r="5" fill="var(--accent)"/>
    <text x="${W - P}" y="${P + 12}" text-anchor="end" font-size="12" fill="currentColor">${hi}kg</text>
    <text x="${W - P}" y="${H - P - 2}" text-anchor="end" font-size="12" fill="currentColor">${lo}kg</text></svg>`;
}

  document.querySelectorAll('.tabs a').forEach(t => t.setAttribute('aria-current', t.dataset.tab === state.view ? 'page' : 'false'));
  VIEWS[state.view]();
  $('#bgart').innerHTML = BG_ART[state.view] || '';
  if (window.onRendered) window.onRendered();
}
function route() { const h = (location.hash || '').replace('#', ''); state.view = VIEWS[h] ? h : 'today'; render(); window.scrollTo(0, 0); }
function go(view) { if (location.hash !== '#' + view) location.hash = view; else route(); }
window.addEventListener('hashchange', route);

/* ---------- Events ---------- */
document.addEventListener('click', async ev => {
  const tt = ev.target.closest('a[data-tt]');
  if (tt && window.openTikTok && window.openTikTok(tt.dataset.tt)) { ev.preventDefault(); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'prevDay') { state.date = addDays(state.date, -1); render(); }
  else if (act === 'nextDay') { state.date = addDays(state.date, 1); render(); }
  else if (act === 'goToday') { state.date = TODAY; render(); }
  else if (act === 'goDate') { state.date = b.dataset.date; state.weekStart = mondayOf(b.dataset.date); go('today'); }
  else if (act === 'goMeals') { state.mealDate = b.dataset.date; go('meals'); }
  else if (act === 'calMode') { state.calMode = b.dataset.v; render(); }
  else if (act === 'prevWeek') { state.weekStart = addDays(state.weekStart, -7); render(); }
  else if (act === 'nextWeek') { state.weekStart = addDays(state.weekStart, 7); render(); }
  else if (act === 'prevMonth' || act === 'nextMonth') { const m = parse(state.monthStart); m.setMonth(m.getMonth() + (act === 'nextMonth' ? 1 : -1)); state.monthStart = iso(m); render(); }
  else if (act === 'prevMealDay') { state.mealDate = addDays(state.mealDate, -1); render(); }
  else if (act === 'nextMealDay') { state.mealDate = addDays(state.mealDate, 1); render(); }
  else if (act === 'goTests') { state.testDate = state.date; state.testOpen = true; go('progress'); }
  else if (act === 'tick') {
    const i = Number(b.dataset.i), dr = touchDraft(), k = dr.done.indexOf(i);
    if (k >= 0) dr.done.splice(k, 1); else dr.done.push(i);
    const on = k < 0; b.setAttribute('aria-pressed', String(on)); b.closest('.ex').classList.toggle('done', on); saveDrafts();
    if (on) celebrate(false);
  }
  else if (act === 'mealTick') {
    if (state.readOnly) { toast(NO_WRITE); return; }
    const d = state.mealDate, cur = mealsFor(d).slice(), i = Number(b.dataset.i), k = cur.indexOf(i);
    if (k >= 0) cur.splice(k, 1); else cur.push(i);
    if (k < 0) celebrate(cur.length === MEALS.length);
    if (cur.length === MEALS.length) toast('Every meal ticked. That’s how props get built.');
    await store.put('meals', d, { date: d, ticks: cur.sort((a, c) => a - c) });
  }
  else if (act === 'kgUp' || act === 'kgDown') {
    const lift = b.dataset.lift, inp = $('#kg-' + lift); let kg = parseFloat(inp.value) || 0;
    kg = Math.max(0, kg + (act === 'kgUp' ? 2.5 : -2.5)); inp.value = kg;
    const dr = touchDraft(); dr.lifts[lift] = { ...(dr.lifts[lift] || {}), kg }; saveDrafts();
  }
  else if (act === 'feel') { const dr = touchDraft(); dr.feel = Number(b.dataset.v); saveDrafts(); b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
  else if (act === 'pain') { const dr = touchDraft(); dr.pain = b.dataset.v === 'yes'; saveDrafts(); b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('#painAlert').hidden = !dr.pain; }
  else if (act === 'rest') startRest(Number(b.dataset.sec));
  else if (act === 'variant') { LS.set('ohio_var_' + b.dataset.slot, Number(b.dataset.j)); render(); }
  else if (act === 'save') saveSession();
  else if (act === 'saveTest') saveTest();
  else if (act === 'editTest') { state.testDate = b.dataset.date; state.testOpen = true; render(); }
  else if (act === 'copySummary') copyText(buildSummary(), 'summaryBox');
  else if (act === 'copyShop') { const p = prepFor(isSunday(state.mealDate) ? addDays(state.mealDate, 1) : state.mealDate); copyText(`Meal prep: ${p.name}\n` + p.shop.map(([a, q]) => `- ${a}: ${q}`).join('\n') + '\n- Eggs: 12\n- Peanuts or almonds, sultanas, choc chips (trail mix)\n- Greek yoghurt: 5 tubs', 'summaryBox'); }
  else if (act === 'saveWeight') {
    const kg = parseFloat($('#wkg').value), date = $('#wdate').value || TODAY;
    if (!isFinite(kg) || kg < 40 || kg > 200) { toast('Enter his weight in kg, like 91.2'); return; }
    const ok = await store.put('weights', date, { date, kg: Math.round(kg * 10) / 10 });
    if (ok) { const prev = state.weights.filter(w => w.date < date).sort((a, c) => a.date < c.date ? 1 : -1)[0]; celebrate(!!prev && kg > prev.kg); toast(prev ? `${(kg - prev.kg >= 0 ? '+' : '') + (kg - prev.kg).toFixed(1)}kg since ${fmtShort(prev.date)}` : 'Weigh-in saved.'); }
  }
  else if (act === 'sound') { LS.set('ohio_sound', b.dataset.v); if (b.dataset.v !== 'Off') SOUNDS[b.dataset.v](); render(); }
  else if (act === 'delLog') {
    if (b.dataset.confirm === '1') { await store.del('logs', b.dataset.id); toast('Deleted.'); }
    else { b.dataset.confirm = '1'; b.textContent = 'Tap again to delete'; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = 'Delete'; } }, 3000); }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'notes') { const dr = touchDraft(); dr.notes = t.value; saveDrafts(); }
  else if (t.dataset && t.dataset.lift && t.tagName === 'INPUT') { const dr = touchDraft(); const kg = parseFloat(t.value); dr.lifts[t.dataset.lift] = { ...(dr.lifts[t.dataset.lift] || {}), kg: isFinite(kg) ? kg : 0 }; saveDrafts(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.clean) { const dr = touchDraft(); dr.lifts[t.dataset.clean] = { ...(dr.lifts[t.dataset.clean] || {}), clean: t.checked }; saveDrafts(); if (t.checked) celebrate(false); }
  else if (t.id === 'tdate') { state.testDate = t.value || TODAY; state.testOpen = true; render(); }
});

/* ---------- Rest timer ---------- */
let tEnd = 0, tInt = null;
function beep(times) { for (let i = 0; i < times; i++) tone(880, i * 0.28, 0.2, 'square', 0.25); }
function startRest(sec) {
  audio(); tEnd = Date.now() + sec * 1000;
  const el = $('#timer'); el.classList.add('show'); el.classList.remove('finished');
  $('#timerLab').textContent = 'Rest. Full recovery so the next rep is fast.';
  clearInterval(tInt); tickTimer(); tInt = setInterval(tickTimer, 250);
}
function tickTimer() {
  const left = Math.ceil((tEnd - Date.now()) / 1000);
  $('#timerT').textContent = mmss(Math.max(0, left));
  if (left <= 0) { clearInterval(tInt); tInt = null; $('#timer').classList.add('finished'); $('#timerLab').textContent = 'Go. Next rep.'; beep(3); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
}
$('#timerAdd').addEventListener('click', () => { if (!tInt) { startRest(15); return; } tEnd += 15000; tickTimer(); });
$('#timerStop').addEventListener('click', () => { clearInterval(tInt); tInt = null; $('#timer').classList.remove('show', 'finished'); });

/* ---------- For the phone app layer ---------- */
window.OHIO = { get state() { return state; }, keyFor, sessionFor, phaseFor, addDays, isTrainKey, isSunday, fmt, TODAY, TEST_DAYS, MORNING, BEDTIME, pick, afternoonLine, prepFor, toast, render: () => render() };

route();
store.init();
})();
</script>
