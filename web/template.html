<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ohio Training">
<title>Ohio Off-Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one-column phone app, header + view + fixed bottom tabs. Hi-vis amber on slate, like cones on a training paddock. */
  --bg: #f2f1ec;
  --surface: #ffffff;
  --ink: #16191d;
  --muted: #5c626a;
  --line: #dddbd3;
  --accent: #f0a400;
  --accent-ink: #1b1400;
  --accent-text: #875b00;
  --good: #1d7a4c;
  --bad: #bf3626;
  --soft: #f7f6f2;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101316; --surface: #191e23; --ink: #eef0f2; --muted: #9aa3ad; --line: #2a3239;
    --accent: #ffb81c; --accent-ink: #1b1400; --accent-text: #ffc84a; --good: #4cc38a; --bad: #ff6d5c; --soft: #151a1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101316; --surface: #191e23; --ink: #eef0f2; --muted: #9aa3ad; --line: #2a3239;
  --accent: #ffb81c; --accent-ink: #1b1400; --accent-text: #ffc84a; --good: #4cc38a; --bad: #ff6d5c; --soft: #151a1e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; line-height: 1.05; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(92px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 30px; font-weight: 800; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.ok .dot { background: var(--good); }
.sync.warn .dot { background: var(--accent); }
.sync.err .dot { background: var(--bad); }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 0; min-width: 0; }
.tile b { font-family: var(--display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); line-height: 1.25; }

/* Generic */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.chip.dad { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.note { border-left: 4px solid var(--accent); background: var(--soft); padding: 10px 12px; border-radius: 8px; font-size: 15px; }
.alert { border-left: 4px solid var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); padding: 10px 12px; border-radius: 8px; font-size: 15px; }
.sec-title { font-family: var(--display); text-transform: uppercase; font-size: 15px; letter-spacing: .08em; color: var(--muted); margin: 6px 2px 0; }

/* Day nav */
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav .label { text-align: center; flex: 1; }
.daynav .label b { display: block; font-family: var(--display); font-size: 22px; text-transform: uppercase; }
.daynav .label span { font-size: 13px; color: var(--muted); }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
.linkbtn { background: none; border: none; color: var(--accent-text); font-weight: 600; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }

/* Session hero */
.hero { border-left: 6px solid var(--accent); }
.hero .kicker { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: var(--accent-text); }
.hero h2 { font-size: 36px; font-weight: 800; }
.hero .sub { font-size: 17px; font-weight: 600; margin-top: -4px; }

/* Warm-up */
details.block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
details.block > summary { list-style: none; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
details.block > summary::-webkit-details-marker { display: none; }
details.block > summary::after { content: "Show"; font-size: 13px; color: var(--accent-text); font-weight: 600; }
details.block[open] > summary::after { content: "Hide"; }
.wu { list-style: none; margin: 0; padding: 0 16px 14px; display: flex; flex-direction: column; gap: 6px; }
.wu li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--line); padding-top: 6px; font-size: 15px; }
.wu li span:last-child { color: var(--muted); text-align: right; white-space: nowrap; }

/* Exercises */
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.tick { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--soft); display: grid; place-items: center; color: transparent; }
.tick svg { width: 22px; height: 22px; }
.ex.done .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex.done .ex-name { color: var(--muted); }
.ex-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ex-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.ex-name { font-weight: 700; font-size: 16px; }
.ex-dose { font-family: var(--display); font-weight: 700; font-size: 19px; color: var(--accent-text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cue { margin: 0; font-size: 14px; color: var(--muted); }
.ex-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.pill { border: 1.5px solid var(--line); background: var(--soft); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pill svg { width: 16px; height: 16px; }
.lift { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; padding: 10px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
.stepper { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.stepper button { width: 40px; height: 40px; border: none; background: transparent; font-size: 20px; font-weight: 700; }
.stepper input { width: 64px; height: 40px; border: none; text-align: center; font-weight: 700; font-size: 17px; background: transparent; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); flex-basis: 100%; }

/* Finish card */
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.seg button, .two button { border: 1.5px solid var(--line); background: var(--soft); border-radius: 12px; padding: 8px 4px; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.seg button b { font-family: var(--display); font-size: 20px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two button { padding: 12px 6px; font-size: 15px; }
.two button[aria-pressed="true"].ok { background: var(--good); border-color: var(--good); color: #fff; }
.two button[aria-pressed="true"].hurt { background: var(--bad); border-color: var(--bad); color: #fff; }
textarea, .field input, .field select { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--soft); padding: 10px 12px; }
textarea { min-height: 72px; resize: vertical; }
label.lbl { font-size: 14px; font-weight: 600; }
.primary { width: 100%; border: none; border-radius: 14px; padding: 15px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-size: 21px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.primary:disabled { opacity: .5; }
.saved-line { font-size: 14px; color: var(--good); font-weight: 600; text-align: center; }

/* Week */
.week { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.week button { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
.week .today-row { border: 2px solid var(--accent); }
.wday { font-family: var(--display); text-transform: uppercase; text-align: center; line-height: 1; }
.wday b { display: block; font-size: 22px; }
.wday span { font-size: 12px; color: var(--muted); }
.wtitle { font-weight: 700; }
.wsub { font-size: 14px; color: var(--muted); }
.status { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.status.done { background: var(--good); color: #fff; border-color: var(--good); }
.status.today { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.status.missed { color: var(--muted); }
.status.rest { color: var(--muted); border-style: dashed; }

/* Plan */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.phase.now { border: 2px solid var(--accent); }
.phase.past { opacity: .62; }
.phase-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.phase h3 { font-size: 20px; }
.phase .dates { font-size: 13px; color: var(--muted); white-space: nowrap; }
.bar { height: 6px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }

/* Tests */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
thead th { font-family: var(--display); text-transform: uppercase; font-size: 14px; letter-spacing: .03em; color: var(--muted); }
tr:last-child td { border-bottom: none; }
.up { color: var(--good); font-weight: 700; }
.down { color: var(--bad); font-weight: 700; }

/* Log */
.lifts3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lifts3 .tile b { font-size: 26px; }
.loglist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.logitem { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.logitem .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1.5px dashed var(--line); border-radius: 14px; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 5; }
.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; border-radius: 10px; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--soft); }
.tabs a[aria-current="page"] svg { color: var(--accent-text); }

/* Rest timer */
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); width: min(528px, calc(100% - 32px)); background: var(--ink); color: var(--bg); border-radius: 18px; padding: 12px 14px; display: none; align-items: center; gap: 12px; z-index: 6; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.timer.show { display: flex; }
.timer .t { font-family: var(--display); font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 92px; }
.timer .lab { flex: 1; font-size: 14px; line-height: 1.3; }
.timer button { border: none; border-radius: 10px; padding: 9px 12px; font-weight: 700; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); }
.timer.finished { background: var(--accent); color: var(--accent-ink); }
.timer.finished button { color: var(--accent-ink); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 9; display: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { display: block; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  .ex, .tick { transition: background-color .15s, border-color .15s; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Ohio</h1>
      <p id="phaseLine">Prop forward · 6ft · 90kg</p>
    </div>
    <div class="sync" id="sync" role="status"><span class="dot"></span><span id="syncText">Loading</span></div>
  </header>
  <div class="strip" id="strip"></div>

  <main>
    <section id="view-today" data-view="today"></section>
    <section id="view-week" data-view="week" hidden></section>
    <section id="view-plan" data-view="plan" hidden></section>
    <section id="view-tests" data-view="tests" hidden></section>
    <section id="view-log" data-view="log" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Today</a>
  <a href="#week" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</a>
  <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Plan</a>
  <a href="#tests" data-tab="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Tests</a>
  <a href="#log" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Log</a>
</nav>

<div class="timer" id="timer" role="timer" aria-live="polite">
  <div class="t" id="timerT">1:30</div>
  <div class="lab" id="timerLab">Rest. Full recovery so the next rep is fast.</div>
  <button type="button" id="timerAdd">+15s</button>
  <button type="button" id="timerStop">Done</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const fmt = (s, o = { weekday: 'short', day: 'numeric', month: 'short' }) => parse(s).toLocaleDateString('en-AU', o);
const fmtShort = s => parse(s).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
const mondayOf = s => { const d = parse(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return iso(d); };
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TODAY = iso(new Date());
const NO_WRITE = window.NATIVE ? 'Can’t save: this login isn’t allowed yet. Dad needs to add the email to the Firebase rules.' : 'Can’t save: this login can only view. Share the app with him as an Editor.';
const NO_WRITE_HINT = window.NATIVE ? 'This login can’t save yet. Dad needs to add your email to the Firebase rules.' : 'View-only access. Ask Dad to share the app with you as an Editor so you can log.';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_TIMER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4M9 2h6"/></svg>';
const ICON_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const ICON_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const mmss = s => `${Math.floor(s / 60)}:${pad(Math.max(0, s % 60))}`;

/* ---------- The program ---------- */
const PRESEASON = '2027-04-06'; // "early April"
const VIETNAM = '2027-03-20';
const PHASES = [
  { id: 'T', name: 'Test week', start: '2026-11-16', end: '2026-11-22', sp: 1, focus: 'Baseline tests, learn the sessions',
    note: 'Learning week. Go light and leave 3 in the tank. Baseline test day is Saturday.' },
  { id: '1', name: 'Phase 1 · Foundation', start: '2026-11-23', end: '2026-12-20', sp: 1, focus: 'Technique, muscle, base fitness' },
  { id: 'X', name: 'Christmas easy block', start: '2026-12-21', end: '2027-01-03', sp: 1, focus: 'Recover, keep the habit',
    note: 'Easy fortnight: 3–4 sessions a week, drop 1 set from everything, no new PBs. School hols, so 9–10am is fine.' },
  { id: '2', name: 'Phase 2 · Strength', start: '2027-01-04', end: '2027-01-31', sp: 2, focus: 'Heavier lifts, sled sprints start' },
  { id: '3', name: 'Phase 3 · Power & speed', start: '2027-02-01', end: '2027-02-28', sp: 3, focus: 'Turn strength into speed: heavy + jump pairs, reactive agility' },
  { id: '4', name: 'Phase 4 · Peak', start: '2027-03-01', end: '2027-03-19', sp: 4, focus: 'About 30% less volume, same intensity. Sharp and fresh',
    note: 'Peak block: fewer sets, same weights. Quality only. If he feels flat, cut a set.' },
  { id: 'V', name: 'Vietnam', start: '2027-03-20', end: '2027-04-03', sp: 'V', focus: 'Hold what he has gained: 3 short sessions a week',
    note: 'Train early before the heat. Eat big, drink lots of water. Swimming and walking on other days.' },
  { id: 'R', name: 'Pre-season', start: '2027-04-04', end: '2027-05-31', sp: 4, focus: 'Club pre-season starts early April',

function phaseFor(d) {
  if (d < PHASES[0].start) return PHASES[0];
  return PHASES.find(p => d >= p.start && d <= p.end) || PHASES[PHASES.length - 1];
}
function keyFor(d) {
  if (TEST_DAYS.includes(d)) return 'test';
  if (REST_DAYS.includes(d)) return 'rest';
  const dow = parse(d).getDay();
  if (phaseFor(d).id === 'V') return WEEK_V[dow] || 'restV';
  return WEEK[dow];
}
const isTrainKey = k => !(k === 'rest' || k === 'restV');

/* ---------- Lift progression ---------- */
const LIFTS = { squat: { name: 'Squat', start: 45 }, deadlift: { name: 'Deadlift', start: 50 }, bench: { name: 'Bench', start: 62.5 } };
const incFor = (lift, kg) => lift === 'bench' ? 2.5 : (kg < (lift === 'squat' ? 80 : 100) ? 5 : 2.5);
function lastLift(lift, beforeDate) {
  const rows = state.logs.filter(l => l.lifts && l.lifts[lift] && Number(l.lifts[lift].kg) > 0 && (!beforeDate || l.date < beforeDate))
    .sort((a, b) => a.date < b.date ? 1 : -1);
  return rows[0] ? { date: rows[0].date, phase: rows[0].phase, kg: Number(rows[0].lifts[lift].kg), clean: !!rows[0].lifts[lift].clean } : null;
}
function suggest(lift, date) {
  const last = lastLift(lift, date);
  if (!last) return { kg: LIFTS[lift].start, text: `Starting weight ${LIFTS[lift].start}kg. Technique first.` };
  const curSp = phaseFor(date).sp, lastSp = phaseFor(last.date).sp;
  if (curSp !== lastSp) return { kg: last.kg, text: `New reps this block. Last was ${last.kg}kg on ${fmtShort(last.date)}. Pick a weight that leaves 2 in the tank.` };
  if (last.clean) { const kg = last.kg + incFor(lift, last.kg); return { kg, text: `Last ${last.kg}kg on ${fmtShort(last.date)}, all clean → try ${kg}kg.` }; }
  return { kg: last.kg, text: `Last ${last.kg}kg on ${fmtShort(last.date)}, form slipped → stay at ${last.kg}kg.` };
}

  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
state.drafts = LS.get('ohio_drafts', {});

const store = {
  db: null, mode: 'loading',
  async init() {
    setSync('warn', 'Connecting');
    let db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) {
      this.mode = 'local';
      state.logs = LS.get('ohio_logs', []);
      state.tests = LS.get('ohio_tests', []);
      setSync('warn', 'This phone only');
      render();
      return;
    }
    this.db = db;
    try {
      const user = await window.claude.use('user');
      if (user && typeof user.can === 'function') { const c = await user.can('data.write'); if (c === false) state.readOnly = true; }
    } catch (e) {}
    const got = { logs: false, tests: false };
    const timer = setTimeout(() => { if (this.mode === 'loading') setSync('warn', 'Can’t reach data yet'); }, 10000);
    ['logs', 'tests'].forEach(c => {
      db.collection(c).onSnapshot(snap => {
        state[c] = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
        if (!snap.metadata.fromCache) {
          got[c] = true;
          if (got.logs && got.tests) { clearTimeout(timer); this.mode = 'synced'; setSync('ok', state.readOnly ? 'View only' : 'Synced'); }
        }
        render(true);
      }, err => { clearTimeout(timer); this.mode = 'error'; setSync('err', 'Data offline'); });
    });
  },
  async put(c, id, data) {
    if (this.db) {
      const ref = this.db.collection(c).doc(id);
      for (let attempt = 0; attempt < 2; attempt++) {
        try { await ref.set(data); return true; }
        catch (e) {
          const code = e && e.code;
          if (code === 'unavailable' && attempt === 0) { await sleep(600 + Math.random() * 900); continue; }
          if (code === 'invalid_argument') { state.readOnly = true; toast(NO_WRITE); }
          else if (code === 'quota_exceeded') toast('Storage is full. Delete some old entries.');
          else toast('Couldn’t save. Check signal and try again.');
          return false;
        }
      }
      return false;
    }
    const arr = state[c].filter(x => x.id !== id); arr.push({ id, ...data }); state[c] = arr;
    LS.set('ohio_' + c, arr); render(true); return true;
  },
  async del(c, id) {
    if (this.db) { try { await this.db.collection(c).doc(id).delete(); return true; } catch (e) { toast('Couldn’t delete. Try again.'); return false; } }
    state[c] = state[c].filter(x => x.id !== id); LS.set('ohio_' + c, state[c]); render(true); return true;
  }
};

    </div>`;
    const next = (() => { for (let i = 1; i < 8; i++) { const n = addDays(d, i); const k = keyFor(n); if (isTrainKey(k)) return { n, s: sessionFor(k, phaseFor(n).sp) }; } return null; })();
    if (next) h += `<button class="card" type="button" data-act="goDate" data-date="${next.n}" style="text-align:left;cursor:pointer"><span class="muted small">Next session · ${esc(fmt(next.n))}</span><b style="font-size:18px">${esc(next.s.title)}: ${esc(next.s.sub)}</b></button>`;
    h += `</div>`;
    $('#view-today').innerHTML = h;
    return;
  }

  if (s.warm) {
    const w = WARMUPS[s.warm];
    h += `<details class="block" ${dr.done.length ? '' : 'open'}><summary>${esc(w.title)}</summary><ul class="wu">${w.items.map(([a, b]) => `<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join('')}</ul></details>`;
  }

  h += `<div class="sec-title">Main work · tick each one off</div><ol class="exlist">`;
  s.items.forEach((e, i) => {
    const done = dr.done.includes(i);
    let liftHtml = '';
    if (e.lift) {
      const sg = suggest(e.lift, d);
      const cur = dr.lifts[e.lift] || {};
      const kg = cur.kg ?? sg.kg;
      liftHtml = `<div class="lift">
        <div class="stepper" role="group" aria-label="${esc(LIFTS[e.lift].name)} weight in kg">
          <button type="button" data-act="kgDown" data-lift="${e.lift}" aria-label="Less weight">−</button>
          <input id="kg-${e.lift}" inputmode="decimal" value="${esc(kg)}" data-lift="${e.lift}" aria-label="kg">
          <button type="button" data-act="kgUp" data-lift="${e.lift}" aria-label="More weight">+</button>
        </div><span class="muted small">kg</span>
        <label class="check"><input type="checkbox" id="clean-${e.lift}" data-clean="${e.lift}" ${cur.clean ? 'checked' : ''}> Every rep clean</label>
        <span class="hint">${esc(sg.text)}</span>
      </div>`;
    }
    h += `<li class="ex ${done ? 'done' : ''}" data-i="${i}">
      <button class="tick" type="button" data-act="tick" data-i="${i}" aria-pressed="${done}" aria-label="Mark ${esc(e.n)} done">${ICON_CHECK}</button>
      <div class="ex-body">
        <div class="ex-top"><span class="ex-name">${esc(e.n)}</span><span class="ex-dose">${esc(e.d)}</span></div>
        <p class="cue">${esc(e.c)}</p>
        ${e.r ? `<div class="ex-actions"><button class="pill" type="button" data-act="rest" data-sec="${e.r}">${ICON_TIMER} Rest ${mmss(e.r)}</button></div>` : ''}
        ${liftHtml}
      </div>
    </li>`;
  });
  h += `</ol>
  <div class="note"><b>Cool-down · 5 min.</b> ${esc(COOLDOWN)}</div>`;

  if (key === 'test') h += `<button class="primary" type="button" data-act="goTests">Enter test results</button>`;

  const feels = [['1', 'Wrecked'], ['2', 'Flat'], ['3', 'OK'], ['4', 'Good'], ['5', 'Flying']];
  h += `<div class="card">
    <h3 style="font-size:20px">How did it go?</h3>
    <div class="seg" role="group" aria-label="How he felt">${feels.map(([v, l]) => `<button type="button" data-act="feel" data-v="${v}" aria-pressed="${String(dr.feel) === v}"><b>${v}</b>${l}</button>`).join('')}</div>
    <div class="two" role="group" aria-label="Any pain">
      <button type="button" class="ok" data-act="pain" data-v="no" aria-pressed="${dr.pain === false}">No pain</button>
      <button type="button" class="hurt" data-act="pain" data-v="yes" aria-pressed="${dr.pain === true}">Something hurts</button>
    </div>
    <div class="alert" id="painAlert" ${dr.pain === true ? '' : 'hidden'}><b>Stop that exercise.</b> ${esc(PAIN_RULE)} Write where it hurts in the notes.</div>
    <label class="lbl" for="notes">Notes</label>
    <textarea id="notes" placeholder="Sprint times, what felt good, what to fix">${esc(dr.notes)}</textarea>
    <button class="primary" type="button" data-act="save" ${state.readOnly ? 'disabled' : ''}>${log ? 'Update session' : 'Save session'}</button>
    ${log ? `<div class="saved-line">Saved ${esc(fmt(log.date))} · ${(log.done || []).length} of ${s.items.length} done</div>` : ''}
    ${state.readOnly ? `<div class="muted small" style="text-align:center">${esc(NO_WRITE_HINT)}</div>` : ''}
  </div></div>`;
  $('#view-today').innerHTML = h;
}

function currentCtx() { const d = state.date, key = keyFor(d); return { d, key, id: d + '_' + key, ph: phaseFor(d), s: sessionFor(key, phaseFor(d).sp) }; }
function touchDraft() { const { id } = currentCtx(); state.drafts[id] = state.drafts[id] || draftFor(id); return state.drafts[id]; }

async function saveSession() {
  const { d, key, id, ph, s } = currentCtx();
  const dr = touchDraft();
  dr.notes = ($('#notes') || {}).value || '';
  s.items.forEach(e => { if (e.lift) {
    const inp = $('#kg-' + e.lift); const kg = parseFloat(inp && inp.value);
    dr.lifts[e.lift] = { kg: isFinite(kg) ? kg : 0, clean: !!($('#clean-' + e.lift) || {}).checked };
  } });
  const rec = { date: d, key, phase: ph.id, title: s.title, sub: s.sub, total: s.items.length, done: dr.done.slice().sort((a, b) => a - b),
    lifts: dr.lifts, feel: Number(dr.feel) || 0, pain: dr.pain === true ? true : dr.pain === false ? false : null, notes: dr.notes.slice(0, 2000), savedAt: new Date().toISOString() };
  const btn = $('[data-act="save"]'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const ok = await store.put('logs', id, rec);
  if (ok) { delete state.drafts[id]; saveDrafts(); toast(rec.pain ? 'Saved. Get that pain checked before training it again.' : 'Session saved. Good work.'); }
  render(true);
}

}

      <div style="display:flex;gap:8px;margin-top:4px">

/* ---------- Summary for Claude ---------- */
function buildSummary() {
  const feelWord = ['', 'Wrecked', 'Flat', 'OK', 'Good', 'Flying'];
  const from = [addDays(TODAY, -28), PHASES[0].start].sort()[1];
  const L = [`Ohio training summary · ${fmt(TODAY)} · ${phaseFor(TODAY).name}`, '', 'SESSIONS (last 4 weeks)'];
  const logs = state.logs.filter(l => l.date >= from).sort((a, b) => a.date < b.date ? -1 : 1);
  if (!logs.length) L.push('- none logged');
  logs.forEach(l => {
    const lifts = Object.entries(l.lifts || {}).filter(([, v]) => v && v.kg).map(([k, v]) => `${LIFTS[k] ? LIFTS[k].name : k} ${v.kg}kg${v.clean ? ' all clean' : ' form slipped'}`).join(', ');
    L.push(`- ${fmt(l.date)} · ${l.title}: ${(l.done || []).length}/${l.total || '?'} done` + (l.feel ? ` · felt ${feelWord[l.feel]}` : '') + (l.pain === true ? ' · PAIN' : l.pain === false ? ' · no pain' : '') + (lifts ? ` · ${lifts}` : '') + (l.notes ? ` · notes: ${l.notes.replace(/\s+/g, ' ')}` : ''));
  });
  const missed = []; for (let d = from; d < TODAY; d = addDays(d, 1)) { const k = keyFor(d); if (isTrainKey(k) && !state.logs.find(l => l.id === d + '_' + k)) missed.push(`${fmtShort(d)} ${sessionFor(k, phaseFor(d).sp).title}`); }
  if (missed.length) L.push(`Not logged: ${missed.join(', ')}`);
  L.push('', 'TESTS');
  [BASELINE, ...state.tests.slice().sort((a, b) => a.date < b.date ? -1 : 1)].forEach(t => {
    const vals = METRICS.filter(m => t[m.k] !== undefined && t[m.k] !== '' && t[m.k] !== null).map(m => `${m.label} ${t[m.k]}${m.unit === 'reps' ? '' : m.unit}`);
    L.push(`- ${t.label || fmt(t.date)}: ${vals.join(', ') || 'nothing entered'}`);
  });
  return L.join('\n');
}
async function copySummary() {
  const text = buildSummary();
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into Claude.'); }
  catch (e) { const box = $('#summaryBox'); if (box) { box.hidden = false; box.value = text; box.style.minHeight = '200px'; box.focus(); box.select(); } toast('Select all the text in the box and copy it.'); }
}

/* ---------- Render + routing ---------- */
const VIEWS = ['today', 'week', 'plan', 'tests', 'log'];
function render(fromData) {
  // Don't wipe something he is typing into.
  const a = document.activeElement;
  if (fromData && a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && a.closest('main')) { renderStrip(); return; }
  renderStrip();
  VIEWS.forEach(v => { const el = $('#view-' + v); el.hidden = v !== state.view; });
  document.querySelectorAll('.tabs a').forEach(t => t.setAttribute('aria-current', t.dataset.tab === state.view ? 'page' : 'false'));
  ({ today: renderToday, week: renderWeek, plan: renderPlan, tests: renderTests, log: renderLog })[state.view]();
  if (window.onRendered) window.onRendered();
}
function route() {
  const h = (location.hash || '').replace('#', '');
  state.view = VIEWS.includes(h) ? h : 'today';
  render();
  window.scrollTo(0, 0);
}
function go(view) { if (location.hash !== '#' + view) location.hash = view; else route(); }
window.addEventListener('hashchange', route);

/* ---------- Events ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'prevDay') { state.date = addDays(state.date, -1); render(); }
  else if (act === 'nextDay') { state.date = addDays(state.date, 1); render(); }
  else if (act === 'goToday') { state.date = TODAY; render(); }
  else if (act === 'goDate') { state.date = b.dataset.date; state.weekStart = mondayOf(b.dataset.date); go('today'); }
  else if (act === 'prevWeek') { state.weekStart = addDays(state.weekStart, -7); render(); }
  else if (act === 'nextWeek') { state.weekStart = addDays(state.weekStart, 7); render(); }
  else if (act === 'goTests') { state.testDate = state.date; go('tests'); }
  else if (act === 'tick') {
    const i = Number(b.dataset.i), dr = touchDraft();
    const k = dr.done.indexOf(i); if (k >= 0) dr.done.splice(k, 1); else dr.done.push(i);
    const on = k < 0; b.setAttribute('aria-pressed', String(on)); b.closest('.ex').classList.toggle('done', on); saveDrafts();
  }
  else if (act === 'kgUp' || act === 'kgDown') {
    const lift = b.dataset.lift, inp = $('#kg-' + lift); let kg = parseFloat(inp.value) || 0;
    kg = Math.max(0, kg + (act === 'kgUp' ? 2.5 : -2.5)); inp.value = kg;
    const dr = touchDraft(); dr.lifts[lift] = { ...(dr.lifts[lift] || {}), kg }; saveDrafts();
  }
  else if (act === 'feel') {
    const dr = touchDraft(); dr.feel = Number(b.dataset.v); saveDrafts();
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }
  else if (act === 'pain') {
    const dr = touchDraft(); dr.pain = b.dataset.v === 'yes'; saveDrafts();
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('#painAlert').hidden = !dr.pain;
  }
  else if (act === 'rest') startRest(Number(b.dataset.sec));
  else if (act === 'save') saveSession();
  else if (act === 'saveTest') saveTest();
  else if (act === 'copySummary') copySummary();
  else if (act === 'editTest') { state.testDate = b.dataset.date; render(); window.scrollTo(0, 0); }
  else if (act === 'delLog') {
    if (b.dataset.confirm === '1') { await store.del('logs', b.dataset.id); toast('Deleted.'); }
    else { b.dataset.confirm = '1'; b.textContent = 'Tap again to delete'; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = 'Delete'; } }, 3000); }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'notes') { const dr = touchDraft(); dr.notes = t.value; saveDrafts(); }
  else if (t.dataset && t.dataset.lift && t.tagName === 'INPUT') { const dr = touchDraft(); const kg = parseFloat(t.value); dr.lifts[t.dataset.lift] = { ...(dr.lifts[t.dataset.lift] || {}), kg: isFinite(kg) ? kg : 0 }; saveDrafts(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.clean) { const dr = touchDraft(); dr.lifts[t.dataset.clean] = { ...(dr.lifts[t.dataset.clean] || {}), clean: t.checked }; saveDrafts(); }
  else if (t.id === 'tdate') { state.testDate = t.value || TODAY; render(); }
});

/* ---------- Rest timer ---------- */
let tEnd = 0, tInt = null, actx = null;
function beep(times) {
  if (!actx) return;
  try {
    for (let i = 0; i < times; i++) {
      const t0 = actx.currentTime + i * 0.28, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.start(t0); o.stop(t0 + 0.22);
    }
  } catch (e) {}
}
function startRest(sec) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) { actx = null; }
  tEnd = Date.now() + sec * 1000;
  const el = $('#timer'); el.classList.add('show'); el.classList.remove('finished');
  $('#timerLab').textContent = 'Rest. Full recovery so the next rep is fast.';
  clearInterval(tInt); tickTimer(); tInt = setInterval(tickTimer, 250);
}
function tickTimer() {
  const left = Math.ceil((tEnd - Date.now()) / 1000);
  $('#timerT').textContent = mmss(Math.max(0, left));
  if (left <= 0) {
    clearInterval(tInt); tInt = null;
    $('#timer').classList.add('finished'); $('#timerLab').textContent = 'Go. Next rep.';
    beep(3); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
}
$('#timerAdd').addEventListener('click', () => {
  if (!tInt) { startRest(15); return; }
  tEnd += 15000; tickTimer();
});
$('#timerStop').addEventListener('click', () => { clearInterval(tInt); tInt = null; $('#timer').classList.remove('show', 'finished'); });

/* ---------- For the phone app layer ---------- */
window.OHIO = { get state() { return state; }, keyFor, sessionFor, phaseFor, addDays, isTrainKey, fmt, TODAY, TEST_DAYS, toast, render: () => render() };

/* ---------- Go ---------- */
route();
store.init();
})();
